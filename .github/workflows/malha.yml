name: malha-municipal

# Baixa a malha municipal de Alagoas (IBGE ou cópia pública) e grava no repositório,
# em data/malha_municipios_al.geojson. Rodar à mão quando necessário (aba Actions).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  malha:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixa a malha
        run: |
          pip install -r requirements.txt
          python scripts/baixar_malha.py
      - name: Salva no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/malha_municipios_al.geojson
          git diff --cached --quiet && echo "Malha sem alterações." && exit 0
          git commit -m "Atualiza a malha municipal de Alagoas (IBGE)"
          git push
